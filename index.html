<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory & Sales Dashboard</title>
    <meta name="description" content="Inventory and sales dashboard demo: product search and filters, sales metrics, and PDF/Excel export. Built with plain HTML, CSS and JavaScript.">

    <!-- Favicon -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Scripts (defer: run after the HTML is parsed, in order) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script defer src="app.js"></script>
</head>

<body>
    <div id="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2 class="logo">Inventory<span>Pro</span></h2>

            <nav class="menu">
                <a href="#" class="active">Dashboard</a>
                <a href="#">Products</a>
                <a href="#">Sales</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="content">
            <header class="topbar">
                <h1>Dashboard Overview</h1>
            </header>

            <section class="cards" aria-label="Key metrics">
                <article class="card">
                    <h3 class="card-label">Total Products</h3>
                    <p class="card-value" id="total-products">0</p>
                    <p class="card-note" id="total-units"></p>
                </article>
                <article class="card">
                    <h3 class="card-label">Revenue (30 days)</h3>
                    <p class="card-value" id="revenue">$0.00</p>
                    <p class="card-note" id="revenue-note"></p>
                </article>
                <article class="card">
                    <h3 class="card-label">Low Stock Items</h3>
                    <p class="card-value" id="low-stock">0</p>
                    <p class="card-note" id="low-stock-note"></p>
                </article>
                <article class="card">
                    <h3 class="card-label">Inventory Value</h3>
                    <p class="card-value" id="inventory-value">$0.00</p>
                    <p class="card-note">Stock × unit price</p>
                </article>
            </section>

            <section class="table-section">
                <div class="table-header">
                    <h2>Product List</h2>
                    <button id="add-product-btn" class="btn btn-primary">+ Add Product</button>
                </div>

                <div class="toolbar">
                    <input type="search" id="search-input" class="search-bar" placeholder="Search products..." aria-label="Search products">

                    <select id="category-filter" class="category-select" aria-label="Filter by category">
                        <option value="all">All Categories</option>
                    </select>

                    <div class="toolbar-actions">
                        <button id="export-pdf-btn" class="btn btn-secondary">Export to PDF</button>
                        <button id="export-excel-btn" class="btn btn-secondary">Export to Excel</button>
                    </div>
                </div>

                <p id="results-count" class="results-count" aria-live="polite"></p>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Category</th>
                            <th scope="col" class="num">Stock</th>
                            <th scope="col" class="num">Price</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body">
                        <!-- JS inserts rows here -->
                    </tbody>
                </table>
            </section>
        </main>

    </div>

    <!-- Modal: add product -->
    <div id="modal" class="modal hidden">
        <form id="product-form" class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title" novalidate>
            <h2 id="modal-title">Add New Product</h2>

            <label for="new-name">Name</label>
            <input type="text" id="new-name" class="modal-input" autocomplete="off" required>

            <label for="new-category">Category</label>
            <input type="text" id="new-category" class="modal-input" list="category-options" autocomplete="off" required>
            <datalist id="category-options"></datalist>

            <label for="new-stock">Stock</label>
            <input type="number" id="new-stock" class="modal-input" min="0" step="1" required>

            <label for="new-price">Price (USD)</label>
            <input type="number" id="new-price" class="modal-input" min="0.01" step="0.01" required>

            <p id="form-error" class="form-error" role="alert"></p>

            <div class="modal-buttons">
                <button type="button" id="close-modal" class="btn btn-secondary">Cancel</button>
                <button type="submit" id="save-product" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>

    <!-- Avisos -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
