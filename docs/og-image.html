<!DOCTYPE html>
<!--
  Plantilla de la imagen Open Graph (1200×630) de inventory.renzzogg.com.
  Se captura con Chrome headless y el PNG va a og-image.png (raíz del repo).
  Regenerarla (con `python3 -m http.server 8000` corriendo en la raíz; desde WSL
  se usa el Chrome de Windows, y la salida va con ruta de Windows):
    "/mnt/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new \
      --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot="$(wslpath -w "$PWD/og-image.png")" \
      http://localhost:8000/docs/og-image.html
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>OG image — Inventory & Sales Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* Mismos colores que styles.css */
    :root {
      --bg-main: #0d0f14;
      --bg-card: #161923;
      --border-color: #222632;
      --text-primary: #ffffff;
      --text-secondary: #a7afc9;
      --accent: #4f7cff;
      --warning: #ffb547;
      --font: "Inter", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      position: relative;
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font);
      padding: 72px 80px;
      display: flex;
      align-items: center;
      gap: 56px;
    }

    /* Brillo azul en la esquina */
    body::before {
      content: "";
      position: absolute;
      top: -280px;
      right: -220px;
      width: 760px;
      height: 760px;
      background: radial-gradient(circle, rgba(79, 124, 255, 0.20), transparent 65%);
    }

    /* Barra de acento a la izquierda */
    body::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: var(--accent);
    }

    .text {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 28px;
      font-weight: 700;
    }

    .brand span { color: var(--accent); }

    .title {
      margin-top: 40px;
      font-size: 64px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin-top: 24px;
      font-size: 28px;
      line-height: 1.4;
      color: var(--text-secondary);
    }

    .url {
      margin-top: 48px;
      font-size: 26px;
      font-weight: 600;
      color: var(--accent);
    }

    /* Vista previa decorativa del dashboard */
    .preview {
      position: relative;
      width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card,
    .chart {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }

    .card { padding: 18px 20px; }

    .card-label {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .card-value {
      margin-top: 6px;
      font-size: 30px;
      font-weight: 700;
    }

    .card-value.warning { color: var(--warning); }

    .chart { padding: 18px 20px 14px; }

    .chart-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .chart svg { display: block; }
  </style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#161923"/>
        <path d="M16 5 27 10.5v11L16 27 5 21.5v-11Z" fill="#4f7cff"/>
        <path d="M5 10.5 16 16l11-5.5M16 16v11" fill="none" stroke="#161923" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div>Inventory<span>Pro</span></div>
    </div>
    <h1 class="title">Inventory &amp; Sales Dashboard</h1>
    <p class="tagline">Track stock, sales and revenue —<br>export reports to PDF &amp; Excel.</p>
    <p class="url">inventory.renzzogg.com</p>
  </div>

  <div class="preview" aria-hidden="true">
    <div class="cards">
      <div class="card">
        <p class="card-label">Revenue (30 days)</p>
        <p class="card-value">$8,642</p>
      </div>
      <div class="card">
        <p class="card-label">Low Stock Items</p>
        <p class="card-value warning">3</p>
      </div>
    </div>
    <div class="chart">
      <p class="chart-title">Daily Revenue</p>
      <!--
        Ingresos diarios reales de los últimos 30 días (getDailyRevenue(30) de app.js).
        Las ventas de ejemplo se definen como "hace N días", así que la forma no cambia.
        Escala: $0–$2,400 (igual que el eje de la gráfica real), 30 columnas de 398/30 px;
        los días sin ventas no llevan barra.
      -->
      <svg width="398" height="190" viewBox="0 0 398 190">
        <g stroke="#222632" stroke-width="1">
          <line x1="0" y1="8.5" x2="398" y2="8.5"/>
          <line x1="0" y1="53.5" x2="398" y2="53.5"/>
          <line x1="0" y1="98.5" x2="398" y2="98.5"/>
          <line x1="0" y1="143.5" x2="398" y2="143.5"/>
          <line x1="0" y1="188.5" x2="398" y2="188.5"/>
        </g>
        <g fill="#4f7cff">
          <rect x="15.4" y="16" width="9" height="172" rx="2"/>
          <rect x="55.2" y="128" width="9" height="60" rx="2"/>
          <rect x="95" y="181" width="9" height="7" rx="2"/>
          <rect x="134.8" y="162" width="9" height="26" rx="2"/>
          <rect x="161.3" y="83" width="9" height="105" rx="2"/>
          <rect x="187.9" y="151" width="9" height="37" rx="2"/>
          <rect x="214.4" y="178" width="9" height="10" rx="2"/>
          <rect x="240.9" y="178" width="9" height="10" rx="2"/>
          <rect x="267.5" y="161" width="9" height="27" rx="2"/>
          <rect x="280.7" y="182" width="9" height="6" rx="2"/>
          <rect x="307.3" y="102" width="9" height="86" rx="2"/>
          <rect x="333.8" y="158" width="9" height="30" rx="2"/>
          <rect x="347.1" y="184" width="9" height="4" rx="2"/>
          <rect x="360.3" y="183" width="9" height="5" rx="2"/>
          <rect x="373.6" y="136" width="9" height="52" rx="2"/>
          <rect x="386.9" y="179" width="9" height="9" rx="2"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
